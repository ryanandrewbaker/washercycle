relabel_last_cycle:
  name: Relabel last cycle
  description: Relabel the most recently archived cycle and rebuild affected profiles.
  fields:
    program_id:
      name: Program ID
      description: Target programme (quick_wash, daily_wash, bedding, drum_clean).
      required: true
      example: daily_wash
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      selector:
        text:

rebuild_profiles:
  name: Rebuild profiles
  description: Force rebuild of program profiles from accepted training runs.
  fields:
    program_id:
      name: Program ID
      description: Optional single program to rebuild.
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      selector:
        text:

exclude_run:
  name: Exclude run
  description: Exclude a training run from profile aggregation.
  fields:
    run_id:
      name: Run ID
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      selector:
        text:

include_run:
  name: Include run
  description: Re-include a previously excluded training run.
  fields:
    run_id:
      name: Run ID
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      selector:
        text:

delete_run:
  name: Delete run
  description: Delete a training run. Requires confirm=true.
  fields:
    run_id:
      name: Run ID
      required: true
      selector:
        text:
    confirm:
      name: Confirm
      required: true
      selector:
        boolean:
    config_entry_id:
      name: Config entry ID
      selector:
        text:

force_empty:
  name: Force empty
  description: Diagnostic-only state recovery. Requires advanced_diagnostics option.
  fields:
    config_entry_id:
      name: Config entry ID
      selector:
        text:
